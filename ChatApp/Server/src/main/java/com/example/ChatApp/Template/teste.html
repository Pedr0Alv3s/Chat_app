<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Teste Chat WebSocket</title>
</head>
<body>

<h3>Teste Chat</h3>

<input type="text" id="msg" placeholder="Digite uma mensagem">
<button onclick="enviar()">Enviar</button>

<ul id="mensagens"></ul>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    let stompClient = null;

    function conectar() {
        const token = "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIiwiaWF0IjoxNzc1NTY4NzA2LCJleHAiOjE3NzU1NzIzMDZ9.kl05rQxeJdngc_pUWX-1PoySRcT3bHgD-GjbbaEcYL8";

        const socket = new WebSocket("ws://localhost:8080/ws?token=" + token);
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log("Conectado: " + frame);

            // 🔹 Inscreve na sala 1
            stompClient.subscribe("/topic/rooms/1", function (mensagem) {
                const body = JSON.parse(mensagem.body);

                const li = document.createElement("li");
                li.innerText = body.content || JSON.stringify(body);

                document.getElementById("mensagens").appendChild(li);
            });
        });
    }

    function enviar() {
        const conteudo = document.getElementById("msg").value;

        stompClient.send("/app/chat.send", {}, JSON.stringify({
            sala_id: 1,
            content: conteudo
        }));
    }

    conectar();
</script>

</body>
</html>
