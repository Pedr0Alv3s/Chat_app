spring.application.name=ChatApp
#arrumar o url jdbc:postgresql://localhost:[numero da porta]/[nome do servidor]
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=zaturo
spring.jpa.hibernate.ddl-auto = update

# Porta dinâmica (Padrão 8081 se não for fornecida via --server.port ou variável PORT)
server.port=${PORT:8081}

# Configurações do RabbitMQ para o Spring AMQP (opcional, já que usamos Relay manual no WebSocketConfig)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest