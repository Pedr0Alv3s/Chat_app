# Configuração do NGINX para Load Balancing e Failover
# Salve este arquivo na pasta do seu NGINX ou aponte para ele.

events {
    worker_connections 4096; # Aumentado para suportar mais usuários e proxies simultâneos
}

http {
    upstream chat_backend {
        # Define as instâncias do servidor Spring Boot
        server localhost:8081;
        server localhost:8082;
        server localhost:8083;
        server localhost:8084;
        server localhost:8085;
    }

    server {
        listen 8080;
        server_name localhost;

        # Configuração para WebSocket (STOMP)
        location /ws {
            proxy_pass http://chat_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            
            # Timeouts para evitar que a conexão caia prematuramente
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Configuração para API REST (Login, Cadastro, etc)
        location / {
            proxy_pass http://chat_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
